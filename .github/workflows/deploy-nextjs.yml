name: Deploy-Next.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Next.js App to EC2
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Copy project files to EC2
      - name: Deploy Code to EC2
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}  # SSH key for authentication
          REMOTE_HOST: ${{ secrets.HOST_DNS }}         # Public IP or DNS of your EC2
          REMOTE_USER: ${{ secrets.USERNAME }}         # SSH username (e.g., ec2-user, ubuntu)
          TARGET: ${{ secrets.TARGET_DIR }}            # Deployment directory (e.g., /home/ubuntu/next)

      # Step 3: Run deployment commands on EC2
      - name: Execute Deployment Commands
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_DNS }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Navigate to the deployment directory
            cd ${{ secrets.TARGET_DIR }}

            # Install Node.js dependencies
            sudo npm install

            # Build the Next.js application
            sudo npm run build

            # Kill any process running on port 3000
            sudo fuser -k 3000/tcp || true

            # Delete the old 'new-app' process if it exists
            pm2 delete new-app || true

            # Start the application using PM2
            pm2 start npm --name "new-app" -- start

            # Save PM2 process list to restart on reboot
            pm2 save
